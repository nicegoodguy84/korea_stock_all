name: Daily KRX Screener

on:
  schedule:
    - cron: '30 22 * * *' # 매일 UTC 기준 22:30 (한국 시간 오전 7:30) 자동 실행
  workflow_dispatch: # 수동으로도 실행 가능하게 설정

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib requests yfinance lxml html5lib

      - name: Run script
        run: python main.py

      - name: Commit and push generated reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-generate daily screening report" || exit 0
          git push
